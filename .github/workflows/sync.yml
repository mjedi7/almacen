name: Sincronizar con la cuenta de Oscar

on:
  push:
    branches:
      - oscar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio origen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # Desactiva las credenciales por defecto de github-actions[bot]

      - name: Enviar cambios a la otra cuenta
        env:
          PAT_OTRA_CUENTA: ${{ secrets.PAT_OTRA_CUENTA }}
        run: |
          git config --global user.name "mjedi7"
          git config --global user.email "oscar.salinas.mora@me.com"
          
          # Se inserta el Token directamente en la URL de destino para la sesion de Git
          git push https://x-access-token:${PAT_OTRA_CUENTA}@github.com/mjedi7/almacen.git HEAD:refs/heads/main --force