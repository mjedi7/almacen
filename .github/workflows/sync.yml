name: Sincronizar con la cuenta de Oscar

on:
  push:
    branches:
      - oscar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio origen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar cambios a la otra cuenta
        env:
          PAT_OTRA_CUENTA: ${{ secrets.PAT_OTRA_CUENTA }}
        run: |
          git config --global user.name "mjedi7"
          git config --global user.email "oscar.salinas.mora@me.com"
          
          # Limpiamos por si ya existe el remote destino
          git remote remove destino || true
          
          # Configuramos el remote inyectando el token de forma segura en la URL
          git remote add destino https://${{ secrets.PAT_OTRA_CUENTA }}@github.com/mjedi7/almacen.git
          
          # Hacemos fetch y push directo a main
          git fetch destino main || true
          git push destino HEAD:refs/heads/main --force