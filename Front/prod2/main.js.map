
<div class="titulo" style="margin: 0 auto;text-align: center;margin-top: 50px;">
    <h3><b>Recargar Stock</b></h3>
    <hr>
</div>

<div class="formulario" style="margin: 0 auto; float:none ;">

<form (ngSubmit)="RecargarStock(f)" #f="ngForm" style="width: 100%;" >

    <div class="form-row mt-5" style="margin: 0 auto; width: 100%;">
   
      <div class="form-group col-md-4">
        <label>Partida</label>
        <select [(ngModel)]="Recargastock.partida" class="form-control" name="Partida" (change)="opcionSeleccionadaX()" required #Partida="ngModel">       
          <option *ngFor="let stock of partidas" [value]="stock.id">
            {{stock.clave}} -- {{stock.descripcion}}
          </option>
        </select>
        <small *ngIf="Partida.invalid && Partida.touched" class="text-danger">Campo Obligatorio</small>
      </div>

     <div class="form-group col-md-4">
      <label>Producto (Busque y seleccione)</label>
      <input type="text" 
             class="form-control" 
             placeholder="Escriba el nombre del producto..."
             [(ngModel)]="terminoBusqueda"
             name="Busqueda" 
             (input)="buscarYSeleccionar()"
             list="listaProductos"
             [attr.disabled]="!Recargastock.partida ? '' : null"> <datalist id="listaProductos">
        <option *ngFor="let p of productosFiltrados" [value]="p.descripcion">
      </datalist>
    </div>

    <div class="form-group col-md-4">
        <label>Proveedor</label>
        <select [(ngModel)]="direccionSeleccionada" class="form-control" name="Proveedor" (change)="CapturarValor()" required #Proveedor="ngModel" 
              [disabled]="!terminoBusqueda"> <option *ngFor="let proveedor of proveedores" [value]="proveedor.id">
                {{proveedor.razon_social}}
            </option>
        </select>
        <small *ngIf="Proveedor.invalid && Proveedor.touched" class="text-danger">Campo Obligatorio</small>
    </div>     
</div>

    <div class="form-row">

          <div class="form-group col-md-2">
            <label>Folio factura</label>
            <input [(ngModel)]="Recargastock.folio" type="text" class="form-control" name="Folio" 
                   [attr.disabled]="articuloValido === false ? '' : null" required>
          </div>

           <div class="form-group col-md-2">
            <label>Costo unitario</label>
            <input type="text" class="form-control" name="CostoUnitario" [value]="costo_unitario | currency" 
                   readonly [attr.disabled]="articuloValido === false ? '' : null">
          </div>

       <div class="form-group col-md-2">
            <label>Cantidad adquirida</label>
            <input [(ngModel)]="Recargastock.cantidad" type="number" class="form-control" name="Cantidad" 
            min="1"
                   (input)="CalcularImporteyTotal()" [attr.disabled]="articuloValido === false ? '' : null" required>
        </div>

         <div class="form-group col-md-2">
            <label>Importe</label>
            <input type="text" [value]="monedaFormateada" class="form-control" readonly>
        </div>

         <div class="form-group col-md-2">
            <label>Total de compra</label>
            <input type="text" [value]="monedaFormateada2" class="form-control" readonly>
        </div>
    
          <div class="form-group col-md-2">
            <label>Fecha de adquisición</label>
            <input [(ngModel)]="Recargastock.fechaAd" type="date" class="form-control" name="FechaAdqui" 
                   required [attr.disabled]="articuloValido === false ? '' : null">
          </div>

    </div>

    <div class="boton mt-5" style="margin: 0 auto;text-align: center;">
        <button type="submit" class="btn btn-primary" [disabled]="f.invalid || articuloValido === false">
           <span class="mdi mdi-content-save"></span> Guardar
        </button>
    </div>
  
</form>
</div>
