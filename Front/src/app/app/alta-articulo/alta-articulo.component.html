<div class="container">

  <div class="titulo" style="margin: 0 auto;text-align: center;margin-top: 50px;">
    <h3><b>Registrar Nuevo Articulo</b></h3>
    <hr>
  </div>


  
	<div class="row">


   
  <!-- Combo unidad_medida -->
<div class="form-group">
  <label>Unidad de Medida</label>
  <select class="form-control" name="id_unidad_medida" [(ngModel)]="articulo.id_unidad_medida" required>
    <option [ngValue]="null" disabled selected>-- Seleccione una unidad --</option>

  <form #f="ngForm" (ngSubmit)="guardarArticulo(f)" class="card p-4 shadow">

    
    <!-- Combo Partidas -->
    <div class="form-group">
      <label><b>Partida</b></label>
      <select class="form-control" name="id_partidas" [(ngModel)]="articulo.id_partidas" required>
        <option *ngFor="let p of partidas" [ngValue]="p.id">
          {{ p.clave }} - {{ p.descripcion }}
        </option>
      </select>
    </div>


  <!-- Descripción -->
  <div class="form-group">
    <label>Descripción</label>
    <input class="form-control" name="descripcion" [(ngModel)]="articulo.descripcion" required>
    <small *ngIf="f.submitted && f.controls['descripcion']?.invalid" class="text-danger">Obligatorio</small>
  </div>

	  <!-- Clave -->
	  <div class="form-group col-md-6">
		<label><b>Clave</b></label>
		<input class="form-control" name="clave" [(ngModel)]="articulo.clave" required maxlength="4"
			   (input)="articulo.clave = articulo.clave?.toUpperCase()?.trim()" />
		<small *ngIf="f.submitted && f.controls['clave']?.invalid" class="text-danger">Obligatorio</small>
	  </div>


	  <!-- Unidad de medida -->
	  <div class="form-group col-md-6">
		<label><b>Unidad de medida</b></label>
		<input class="form-control" 
			   name="unidad_medida" 
			   [(ngModel)]="articulo.unidad_medida" 
			   required 
			   maxlength="5" />
		<small *ngIf="f.submitted && f.controls['unidad_medida']?.invalid" class="text-danger">Obligatorio</small>
	  </div>
	  
	</div>

	<!-- Descripción -->
	<div class="form-group">
	  <label><b>Descripción del Artículo</b></label>
	  <textarea class="form-control" 
				name="descripcion" 
				[(ngModel)]="articulo.descripcion" 
				rows="4" 
				required></textarea>
	  <small *ngIf="f.submitted && f.controls['descripcion']?.invalid" class="text-danger">Obligatorio</small>
	</div>

  <!-- Unidad de medida -->
  <!-- <div class="form-group">
    <label>Unidad de medida</label>
    <input class="form-control" name="unidad_medida" [(ngModel)]="articulo.unidad_medida" required
           (input)="articulo.unidad_medida = articulo.unidad_medida?.toUpperCase()?.trim()" maxlength="5"/>
    <small *ngIf="f.submitted && f.controls['unidad_medida']?.invalid" class="text-danger">Obligatorio</small>
  </div> -->

  <!-- Activo / Básico -->

  <!-- <div class="form-row">
    <div class="form-group col-md-3">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="esActivo" name="esActivo" [(ngModel)]="articulo.esActivo">
        <label class="form-check-label" for="esActivo">Activo</label>

    <!-- Fila con Clave y Unidad de Medida juntas -->
    <div class="row">
      <!-- Clave -->      
      <div class="form-group col-md-6">     
        <label><b>Clave</b></label>     
        <input class="form-control" name="clave" [(ngModel)]="articulo.clave" required maxlength="4"      
            (input)="articulo.clave = articulo.clave?.toUpperCase()?.trim()" />      
        <small *ngIf="f.submitted && f.controls['clave']?.invalid" class="text-danger">Obligatorio</small>      

      </div>
  
      <!-- Combo unidad_medida -->
      <div class="form-group col-md-6">
        <label><b>Unidad de Medida</b></label>
        <select class="form-control" name="id_unidad_medida" [(ngModel)]="articulo.id_unidad_medida" required>
          <option [ngValue]="null" disabled selected>-- Seleccione una unidad --</option>
          <option *ngFor="let u of unidad_medida" [ngValue]="u.id">
            {{ u.nombre_medida }}
          </option>
        </select>
      </div>
    </div>

    <!-- Descripción -->
    <div class="form-group">
      <label><b>Descripción del Artículo</b></label>
      <textarea class="form-control" 
                name="descripcion" 
                [(ngModel)]="articulo.descripcion" 
                rows="4" 
                required></textarea>
      <small *ngIf="f.submitted && f.controls['descripcion']?.invalid" class="text-danger">Obligatorio</small>
    </div>

    <button class="btn btn-primary w-24 m-auto" type="submit" [disabled]="loading || f.invalid">
      {{ loading ? 'Guardando…' : 'Guardar artículo' }}
    </button>

  </form>

</div>
