<!-- REPORTE DE EXISTENCIAS (HTML / PUPPETEER) -->
<div class="titulo" style="margin: 0 auto; text-align: center; margin-top: 40px;">
  <h3><b>Reporte de existencias por partida</b></h3>
  <hr style="width: 80%;">
</div>

<div class="contenedor d-flex justify-content-center align-items-center" style="width: 95%; margin: 0 auto;">
  <form (ngSubmit)="GeneraReporteExistenciasHTML(fExistencias)" #fExistencias="ngForm" style="width: 90%;">
    <div class="form-row mt-4 align-items-end">

      <!-- 1. Selección de Partida -->
      <div class="form-group col-md-4">
        <label for="partidaExistencias" style="font-weight: 600;">Partida:</label>
        <select [(ngModel)]="reporteExistencias.partida" id="partidaExistencias" class="form-control"
          name="partidaExistencias" required #partidaE="ngModel">
          <option value="">Seleccione una partida...</option>
          <option value="0">TODAS LAS PARTIDAS</option>
          <ng-container *ngFor="let p of partidas">
            <option *ngIf="p.clave !== '0'" [value]="p.clave">
              {{p.clave}} -- {{p.descripcion}}
            </option>
          </ng-container>
        </select>
        <small *ngIf="partidaE.invalid && partidaE.touched" class="form-text text-danger animated fadeIn">
          Campo Obligatorio
        </small>
      </div>

      <!-- 2. Filtro de Existencias (3 Casos Dinámicos) -->
      <div class="form-group col-md-3">
        <label for="filtroExistencia" style="font-weight: 600;">Existencias:</label>
        <select [(ngModel)]="reporteExistencias.filtroExistencia" id="filtroExistencia" class="form-control"
          name="filtroExistencia" required>
          <option value="todas">Todas</option>
          <option value="con_existencia">Solo con existencia</option>
          <option value="sin_existencia">Solo en cero</option>
        </select>
      </div>

      <!-- 3. Fecha para reporte -->
      <div class="form-group col-md-3">
        <label for="fechaExistencias" style="font-weight: 600;">Fecha de corte:</label>
        <input [(ngModel)]="reporteExistencias.fecha" id="fechaExistencias" class="form-control" type="date"
          name="fechaExistencias" required #fechaE="ngModel">
        <small *ngIf="fechaE.invalid && fechaE.touched" class="form-text text-danger animated fadeIn">
          Campo Obligatorio
        </small>
      </div>

      <!-- 4. Botón Generar PDF -->
      <div class="form-group col-md-2 d-flex justify-content-center">
        <button type="submit" class="btn btn-light" title="Generar Reporte PDF"
          style="margin-bottom: 0.2rem; border: none; background: transparent; cursor: pointer; padding: 0;">
          <i class="mdi mdi-file-pdf-box" style="color: #ac0808; font-size: 46px; line-height: 1;"></i>
        </button>
      </div>

    </div>
  </form>
</div>
