<!-- REPORTE DE SALIDAS / MOVIMIENTOS POR PARTIDA -->
<div class="titulo" style="margin: 0 auto; text-align: center; margin-top: 40px;">
  <h3><b>Reporte de salidas por partida</b></h3>
  <hr style="width: 80%;">
</div>

<div class="contenedor d-flex justify-content-center align-items-center" style="width: 95%; margin: 0 auto;">
  <form (ngSubmit)="GeneraReporte(f)" #f="ngForm" style="width: 90%;">
    <div class="form-row mt-4 align-items-end">

      <!-- 1. Fecha Inicial -->
      <div class="form-group col-md-3">
        <label for="fechaIni" style="font-weight: 600;">Fecha Inicial:</label>
        <input [(ngModel)]="reporte.fechaIni" type="date" class="form-control" name="FechaIni" id="fechaIni"
          required #FechaIni="ngModel">
        <small *ngIf="FechaIni.invalid && FechaIni.touched" class="form-text text-danger animated fadeIn">
          Campo Obligatorio
        </small>
      </div>

      <!-- 2. Fecha Final -->
      <div class="form-group col-md-3">
        <label for="fechaFin" style="font-weight: 600;">Fecha Final:</label>
        <input [(ngModel)]="reporte.fechaFin" type="date" class="form-control" name="FechaFin" id="fechaFin"
          required #FechaFin="ngModel">
        <small *ngIf="FechaFin.invalid && FechaFin.touched" class="form-text text-danger animated fadeIn">
          Campo Obligatorio
        </small>
      </div>

      <!-- 3. Partida (Con opción 'TODAS LAS PARTIDAS') -->
      <div class="form-group col-md-4">
        <label for="partidaSelect" style="font-weight: 600;">Partida:</label>
        <select [(ngModel)]="reporte.partida" id="partidaSelect" class="form-control" name="Partida"
          required #Partida="ngModel">
          <option value="">Seleccione una partida...</option>
          <option value="0">TODAS LAS PARTIDAS</option>
          <ng-container *ngFor="let p of partidas">
            <option *ngIf="p.clave !== '0'" [value]="p.clave">
              {{p.clave}} -- {{p.descripcion}}
            </option>
          </ng-container>
        </select>
        <small *ngIf="Partida.invalid && Partida.touched" class="form-text text-danger animated fadeIn">
          Campo Obligatorio
        </small>
      </div>

      <!-- 4. Botón Generar PDF -->
      <div class="form-group col-md-2 d-flex justify-content-center">
        <button type="submit" class="btn btn-light" title="Generar Reporte PDF"
          style="margin-bottom: 0.2rem; border: none; background: transparent; cursor: pointer; padding: 0;">
          <i class="mdi mdi-file-pdf-box" style="color: #ac0808; font-size: 46px; line-height: 1;"></i>
        </button>
      </div>

    </div>
  </form>
</div>
