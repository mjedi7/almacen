<div class="login-page">

    <div class="form card-body">

        <div class="line-1 anim-typewriter">

            <div class="logo-container">
                <span class="color-green">SIC</span>
                <span class="color-orange">AI</span>
            </div>

            <!---
            <img _ngcontent-uhw-c18="" src="./assets/images/letras_logo.png" width="90px" height="25px" alt="SICAI" class="letras">
            <h1 style="text-align: center; font-size: 30px;margin: 0 auto;font-weight: bold;color:#d97103">SICAI</h1>
            -->

            <p style="text-align: center; font-size: 18px;margin: 0 auto;font-weight: bold;color: rgb(59, 70, 68);">Sistema de Control de Almacén e Insumos</p>

         </div>

         <br>         
         
         <img src="./assets/images/sicai_2.2.png" alt="" style="max-width: 70%;max-height: 70%;">
   

      <form (ngSubmit)="buscaUsuario(f,usuario.email,usuario.password); f.resetForm()" #f="ngForm" class="form-horizontal form-material login-form m-t-20">
        
        <small *ngIf="email.invalid && email.touched" class="form-text text-danger animated fadeIn">Olvido escribir su Usuario</small>
        <div class="form-group m-t-5">
            <div class="col-xs-12">
                <input [(ngModel)]="usuario.email" class="form-control" type="text" name="usuario" required placeholder="Usuario" #email="ngModel"/>
            </div>
        </div>


        <small *ngIf="password.invalid && password.touched" class="form-text text-danger animated fadeIn">Olvido escribir su contraseña</small>  
        <div class="form-group m-t-5">
            <div class="col-xs-12">
        <input [(ngModel)]="usuario.password" class="form-control" type="password" name="password" required placeholder="Contraseña" #password="ngModel"/>
    </div>
</div>

        <!-- <button type="submit">Entrar</button> -->
        <br>
        <button type="submit" style="
				background-color: #991111; 
				<!-- color: #d97103; -->
				padding: 20px 20px; 
				border: none; 
				border-radius: 4px; 
				cursor: pointer;
				box-shadow: 0px 4px 6px rgba(0, 0, 0, 2.0);
				<!-- font-weight: bold; -->
				">
					Entrar
		</button>

        <br>

      </form>
    </div>
  </div>
