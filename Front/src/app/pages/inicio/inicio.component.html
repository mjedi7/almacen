<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<main class="inicio-page container-fluid">
  <section class="inicio-content">

    <div class="logo-container" aria-label="SICAI">
      <span class="color-green">SIC</span><span class="color-orange">AI</span>
    </div>

    <h1 class="inicio-title">Sistema de Control de Almacén e Inventario</h1>

    <div class="logo-image-wrap">
      <img
        src="assets/images/PROPUESTAS_SICAI_1.2.png"
        alt="Logotipo de SICAI"
        class="img-fluid logo-image">
    </div>

    <section class="quick-access" aria-labelledby="accesos rapidos">
    
		<!-- <h2 id="quick-access-title" class="accesos rapidos">Accesos rápidos</h2> -->
		
      <div class="row g-3 justify-content-center">
        <div class="col-12 col-sm-6 col-xl-3">
          <a class="quick-card" routerLink="/dashboard/generar-documento">
            <span class="quick-card-icon icon-purchase" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 3.75h7l4 4v12.5H7a2 2 0 0 1-2-2V5.75a2 2 0 0 1 2-2Z"/><path d="M14 3.75v4h4M8.5 12h7M8.5 15.5h7M8.5 8.5h2"/></svg>
            </span>
            <span class="quick-card-copy">
              <span class="quick-card-name">Registrar Compra</span>
              <span class="quick-card-description">Capturar una nueva compra</span>
            </span>
            <span class="quick-card-arrow" aria-hidden="true">›</span>
          </a>
        </div>

        <div class="col-12 col-sm-6 col-xl-3">
          <a class="quick-card" routerLink="/dashboard/mis-seguimientos">
            <span class="quick-card-icon icon-stock" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5-8 4.5-8-4.5Z"/><path d="M4 12l8 4.5 8-4.5M4 16.5 12 21l8-4.5M12 12v9"/></svg>
            </span>
            <span class="quick-card-copy">
              <span class="quick-card-name">Recargar Stock</span>
              <span class="quick-card-description">Registrar una entrega de artículos</span>
            </span>
            <span class="quick-card-arrow" aria-hidden="true">›</span>
          </a>
        </div>

        <div class="col-12 col-sm-6 col-xl-3">
          <a class="quick-card" routerLink="/dashboard/existencias">
            <span class="quick-card-icon icon-inventory" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 5.5h16v14H4zM8 5.5V3h8v2.5M8 10h8M8 13.5h8M8 17h4"/></svg>
            </span>
            <span class="quick-card-copy">
              <span class="quick-card-name">Existencias</span>
              <span class="quick-card-description">Consultar artículos disponibles</span>
            </span>
            <span class="quick-card-arrow" aria-hidden="true">›</span>
          </a>
        </div>

        <div class="col-12 col-sm-6 col-xl-3">
          <a class="quick-card" routerLink="/dashboard/estadistico-general">
            <span class="quick-card-icon icon-transfer" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 8h14M14 4l4 4-4 4M20 16H6m4-4-4 4 4 4"/></svg>
            </span>
            <span class="quick-card-copy">
              <span class="quick-card-name">Transferencias</span>
              <span class="quick-card-description">Transferir artículos a planteles/Direcciones</span>
            </span>
            <span class="quick-card-arrow" aria-hidden="true">›</span>
          </a>
        </div>
      </div>
    </section>
  </section>
</main>
