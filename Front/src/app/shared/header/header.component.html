<header class="topbar">
  <nav class="navbar top-navbar navbar-expand-md navbar-light" style="background-color: #ffffff">

    <div class="navbar-header">
      <a class="navbar-brand" routerLink="/dashboard">
        <b>
          <!-- Icono de la cajita (se queda siempre) -->
          <img src="./assets/images/logo.png" width="60px" height="55px" alt="homepage" class="dark-logo" />

          <!-- Texto SICAI con la clase dinámica vinculada al Observable -->
          <img 
            src="./assets/images/letras.png" 
            width="90px" 
            height="30px" 
            class="letras"
            [class.letras-ocultas]="sidebarService.isMini$ | async" 
            alt="SICAI" 
          />
        </b>
      </a>
    </div>

    <div class="navbar-collapse">
     <ul class="navbar-nav mr-auto">
        <!-- Botón Hamburguesa universal (Desktop, Laptop y Mitad de pantalla) -->
        <li class="nav-item">
  <button type="button" 
          class="btn btn-link nav-link waves-effect waves-dark" 
          (click)="toggleSidebar($event)" 
          style="cursor: pointer; border: none; background: transparent; padding: 0.5rem 1rem;">
    <i style="color: #b40f0f; font-size: 1.4rem;" 
       class="ti-menu" 
       [class.menu-rotado]="sidebarService.isMini$ | async"></i>
  </button>
</li>
      </ul>

      <div class="navbar-collapse banner-container" style="text-align: center; background: transparent;">
        <img class="rounded mx-auto d-block banner-pleca" src="./assets/images/pleca-diglet.jpg" alt="Banner institucional">
      </div>

      <!-- Datos del perfil -->
      <ul class="navbar-nav my-lg-0">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle waves-effect waves-dark" href="" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <img src="./assets/images/cecytev.ico" class="profile-pic" />
          </a>
          <div class="dropdown-menu dropdown-menu-right animated fadeIn fast">
            <ul class="dropdown-user">
              <li>
                <div class="dw-user-box"></div>
              </li>
              <li role="separator" class="divider"></li>
              <li><a style="color: #555555"><i style="color: #b40f0f" class="ti-home"></i><b> {{plantel}}</b></a></li>
              <li><a style="color: #555555"><i style="color: #b40f0f" class="ti-user"></i><b> {{Correo}}</b></a></li>
              <li role="separator" class="divider"></li>
              <li>
                <a style="color:#b40f0f" routerLink="/login"><i style="color: #646363" class="fa fa-power-off"></i><b> Cerrar sesión</b></a>
              </li>
            </ul>
          </div>
        </li>
      </ul>
      <h5 style="text-align:center"> <strong style="color: brown;">Bienvenido</strong><br> {{Nombre}}</h5>
    </div>
  </nav>
</header>
