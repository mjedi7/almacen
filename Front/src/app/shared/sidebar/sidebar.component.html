<aside class="left-sidebar sicai-sidebar" aria-label="Menú principal">
  <div class="scroll-sidebar">
    <nav class="sidebar-nav" aria-label="Navegación">
      <ul id="sidebarnav" class="sicai-menu">

        <li *ngFor="let item of menuItems" class="sicai-menu-group" [class.menu-open]="isOpen(item.titulo)" [hidden]="!hasVisibleItems(item)">
          <button type="button" class="sicai-menu-trigger" (click)="toggleGroup(item.titulo)" [attr.aria-expanded]="isOpen(item.titulo)">
            <i class="fa fa-archive" aria-hidden="true"></i><span class="hide-menu">{{ item.titulo }}</span>
            <span class="sicai-menu-count hide-menu">{{ visibleCount(item) }}</span><i class="fa fa-chevron-down sicai-chevron hide-menu" aria-hidden="true"></i>
          </button>
          <ul class="sicai-submenu" [class.is-open]="isOpen(item.titulo)" [attr.aria-hidden]="!isOpen(item.titulo)">
            <li *ngFor="let sub of item.submenu"><a *ngIf="sub.mostrar" [routerLink]="sub.url" routerLinkActive="active" (click)="closeMobileSidebar()">{{ sub.titulo }}</a></li>
          </ul>
        </li>

        <li *ngFor="let item of menuItems3" class="sicai-menu-group" [class.menu-open]="isOpen(item.titulo)" [hidden]="!vertransferencias || !hasVisibleItems(item)">
